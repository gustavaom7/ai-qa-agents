name: Nightly agents

# 1. agents  — live runs with free-tier LLMs (skipped without keys), then a
#              review PR with the new findings and recorded answers.
# 2. demo    — persona_testing on the local bug shop with a scripted model,
#              so the published report always shows the pipeline working.
# 3. report  — builds the HTML report and publishes it to GitHub Pages.
on:
  schedule:
    - cron: "17 6 * * *"  # 03:17 BRT
  push:
    branches: [main]
    paths: ["findings/**"]  # a merged review republishes the report
  workflow_dispatch:
    inputs:
      missions:
        description: "persona_testing mission ids, comma-separated (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  agents:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ran: ${{ steps.keys.outputs.ready }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDERS: gemini,groq
      LLM_MODE: auto
      PERSONA_MISSIONS: ${{ inputs.missions }}
    steps:
      - name: Skip without keys
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY" ]; then
            echo "::notice::No GEMINI_API_KEY or GROQ_API_KEY secret; skipping the live run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.keys.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v7
        if: steps.keys.outputs.ready == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        if: steps.keys.outputs.ready == 'true'
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium ffmpeg

      - name: Run persona_testing on saucedemo
        if: steps.keys.outputs.ready == 'true'
        run: uv run agent run persona_testing saucedemo

      - name: Merge findings into the record
        if: steps.keys.outputs.ready == 'true'
        run: |
          uv run agent collect persona_testing --summary review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          cat runs/persona_testing/saucedemo/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.keys.outputs.ready == 'true'
        with:
          name: agents-run
          # Two paths keep the runs/ and cassettes/ prefixes inside the artifact.
          path: |
            runs/
            cassettes/
          retention-days: 14

      - name: Open the review PR
        if: steps.keys.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: nightly/review
          delete-branch: true
          add-paths: |
            findings/*.json
            cassettes/**
          commit-message: "Nightly: new findings and recorded answers"
          title: "Nightly review: persona_testing findings"
          body-path: review.md

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium ffmpeg

      - name: Demo run on the local bug shop
        run: uv run python scripts/demo_bugshop.py

      - uses: actions/upload-artifact@v7
        with:
          name: demo-run
          path: |
            runs/
            findings/persona_testing.md
          retention-days: 14

  report:
    needs: [agents, demo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: demo-run
          path: .

      - uses: actions/download-artifact@v8
        if: needs.agents.outputs.ran == 'true'
        continue-on-error: true
        with:
          name: agents-run
          path: .

      - name: Fetch the published run history
        # The page itself is the store: last build's history.json, plus this run.
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o history.json || echo "[]" > history.json

      - name: Build the report
        run: |
          if [ "${{ needs.agents.outputs.ran }}" = "true" ]; then
            uv run agent collect persona_testing  # show new findings before the PR is merged
          fi
          uv run agent report --out site --history history.json

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: site/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        # Fails until Pages is enabled with source "GitHub Actions" (Settings -> Pages).
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pages not enabled
        if: steps.deploy.outcome == 'failure'
        run: echo "::warning::GitHub Pages deploy failed. Enable Pages with source 'GitHub Actions' in Settings -> Pages. The report is still in the 'report' artifact."
