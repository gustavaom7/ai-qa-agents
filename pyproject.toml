[project]
name = "ai-qa-agents"
version = "0.1.0"
description = "Autonomous QA agents that run nightly against public demo apps and report human-reviewed findings."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gustavo Mesquita" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
agent = "ai_qa_agents.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_qa_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ai_qa_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
